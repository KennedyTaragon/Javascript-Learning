<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
     <title> JavaScript Statements  </title>

   <style>
        /* center everything vertically and horizontally, stacked */
        body {
        display: flex;
        justify-content: center; /* horizontal center */
        align-items: center;     /* vertical center */
        flex-direction: column;  /* stack elements vertically */
        text-align: center;      /* center text inside elements */
        height: 100vh;           /* fill viewport height */
        margin: 0;
        gap: 0.5rem;             /* small space between elements */
        font-family: Arial, sans-serif;
        }

        p { max-width: 600px; }
  </style>
</head>
<body>   
    <h1> JavaScript Statements </h1>

    <p> JavaScript code blocks are written between { and } </p>

    <p id="demo1"></p>
    <p id="demo2"></p>


<script>

    document.getElementById("demo1").innerHTML = "Hello Engineer"
    document.getElementById("demo2").innerHTML = "How are you?"


</script>
</body>
</html>
