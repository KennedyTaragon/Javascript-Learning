<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Nested if</h1>

<p id="age"></p>
<p id="country"></p>
<p id="text"></p>

<script>
let age = 18;
let country = "KENYA";
let text = "You can Not drive!";

if (country == "KENYA") {
  if (age >= 16) {
    text = "You can drive!";
  }
}
document.getElementById("age").innerHTML = "Your age is " + age ;
document.getElementById("country").innerHTML = "Your country is " + country;
document.getElementById("text").innerHTML = text;
</script>

</body>
</html>
