<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
     <title> JavaScript Operators  </title>

   <style>
        /* center everything vertically and horizontally, stacked */
        body {
        display: flex;
        justify-content: center; /* horizontal center */
        align-items: center;     /* vertical center */
        flex-direction: column;  /* stack elements vertically */
        text-align: center;      /* center text inside elements */
        height: 100vh;           /* fill viewport height */
        margin: 0;
        gap: 0.5rem;             /* small space between elements */
        font-family: Arial, sans-serif;
        }

        p { max-width: 600px; }
  </style>
</head>
<body>   
    <h1> JavaScript Operators </h1>
    <h2> The Assignment (=) Operator </h2>

    <p> The = operator is used to assign values to variables. </p>

    <p id="demo"></p>


<script>
    let x = 2;
    let y = 3;
    sum = x + y ;

    document.getElementById("demo").innerHTML = "The sum of " +  x + " and " +  y + " is " + sum ;
 

</script>
</body>
</html>
