<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
     <title> JS Variables  </title>

   <style>
    /* center everything vertically and horizontally, stacked */
    body {
      display: flex;
      justify-content: center; /* horizontal center */
      align-items: center;     /* vertical center */
      flex-direction: column;  /* stack elements vertically */
      text-align: center;      /* center text inside elements */
      height: 100vh;           /* fill viewport height */
      margin: 0;
      gap: 0.5rem;             /* small space between elements */
      font-family: Arial, sans-serif;
    }

    p { max-width: 600px; }
  </style>
</head>
<body>   
    <h1> JS Variables </h1>

    <p> In this example, x is defined as a variable.
Then, x is assigned the value of 6: </p>

    <p id="demo"></p>
    


<script>
    let x;
    x = 6;

    document.getElementById("demo").innerHTML = "The value of x is " + x;


</script>
</body>
</html>
