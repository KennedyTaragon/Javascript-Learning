<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
     <title>  JavaScript const Arrays </title>

   <style>
        /* center everything vertically and horizontally, stacked */
        body {
        display: flex;
        justify-content: center; /* horizontal center */
        align-items: center;     /* vertical center */
        flex-direction: column;  /* stack elements vertically */
        text-align: center;      /* center text inside elements */
        height: 100vh;           /* fill viewport height */
        margin: 0;
        gap: 0.5rem;             /* small space between elements */
        font-family: Arial, sans-serif;
        }

        p { max-width: 600px; }
  </style>
</head>
<body>   
    <h1> JavaScript const Arrays </h1>

    <p> Declaring a constant array does NOT make the elements unchangeable: </p>

    <p id="demo"></p>


<script>
    // Create an Array:
    const cars = ["Saab", "Volvo", "BMW"];
    // Change an element:
    cars[0] = "Toyota";
    // Add an element:
    cars.push("Audi");

    document.getElementById("demo").innerHTML = cars;


</script>
</body>
</html>
